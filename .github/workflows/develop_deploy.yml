name: Deploy Nginx to EC2 (Develop)

# nginx 단독 배포 파이프라인 — 이미지 빌드 없음 (nginx:1.27-alpine 공식 이미지 + conf 마운트).
# 흐름: CI 에서 conf 문법 검증(게이트) → scp → EC2 에서 up/검증 후 reload → 헬스체크.
#
# 필요한 secrets: EC2_HOST, EC2_SSH_KEY (ECR / CloudFront 권한 불필요)

on:
  push:
    branches: [develop]
    paths:
      - 'deploy/**'
      - '.github/workflows/develop_deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 게이트: 잘못된 conf 가 EC2 에 도달하기 전에 차단.
      # (resolver / 변수형 proxy_pass 는 -t 시점에 DNS 해석을 하지 않으므로 CI 에서 검증 가능)
      - name: Validate nginx config
        run: |
          docker run --rm \
            -v "$PWD/deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/deploy/nginx/conf.d:/etc/nginx/conf.d:ro" \
            nginx:1.27-alpine nginx -t

      # repo/deploy/* 를 EC2 ~/bandage-nginx/ 로 업로드.
      # FE 레포가 쓰는 ~/bandage/ 와 분리 — scp 상호 덮어쓰기 방지.
      - name: Upload deploy assets to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: rocky
          key: ${{ secrets.EC2_SSH_KEY }}
          source: 'deploy/*'
          target: '~/bandage-nginx/'
          strip_components: 1
          overwrite: true

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: rocky
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ~/bandage-nginx

            # 전제: BE compose 프로젝트(~/bandage)가 만든 bandage_default 네트워크.
            # 여기서 직접 생성하면 compose 라벨 불일치로 BE 쪽 up 이 깨지므로 생성하지 않는다.
            if ! docker network inspect bandage_default >/dev/null 2>&1; then
              echo "::error::bandage_default 네트워크가 없습니다 — BE 스택(~/bandage)을 먼저 기동하세요."
              exit 1
            fi

            # cutover: 과거 합본 프로젝트(bandage)가 소유한 bandage-nginx 컨테이너가
            # 남아 있으면 이름이 충돌한다 — 제거 후 이 프로젝트(bandage-nginx)로 재생성.
            # (compose 프로젝트명은 실행 디렉토리명 ~/bandage-nginx 에서 파생)
            owner=$(docker inspect bandage-nginx \
              --format '{{ index .Config.Labels "com.docker.compose.project" }}' 2>/dev/null || echo "")
            if [ -n "$owner" ] && [ "$owner" != "bandage-nginx" ]; then
              echo "기존 compose 프로젝트($owner) 소유의 nginx 컨테이너 인계 — 제거 후 재생성"
              docker rm -f bandage-nginx
            fi

            # idempotent — 처음이면 새로 띄우고, 설정 변화 없으면 no-op.
            docker compose up -d

            # 이미 떠 있던 경우 scp 로 갱신된 conf 반영:
            # nginx -t 통과 시에만 reload. 실패하면 기존 프로세스는 이전 conf 로
            # 계속 동작하므로 서비스는 유지되고, 배포만 실패 처리한다.
            if docker exec bandage-nginx nginx -t; then
              docker exec bandage-nginx nginx -s reload
            else
              echo "::error::nginx -t 실패 — reload 생략 (기존 설정으로 동작 유지 중)"
              exit 1
            fi

            # nginx 자체 헬스체크 통과 대기 (최대 60초) — FE/BE 생사와 무관.
            status=unknown
            for i in $(seq 1 30); do
              status=$(docker inspect --format='{{.State.Health.Status}}' bandage-nginx 2>/dev/null || echo unknown)
              if [ "$status" = "healthy" ]; then
                echo "nginx healthy"
                break
              fi
              sleep 2
            done
            if [ "$status" != "healthy" ]; then
              echo "::error::nginx 헬스체크 실패 — 로그 출력 후 종료"
              docker logs --tail=100 bandage-nginx || true
              exit 1
            fi

            # 업스트림 프록시 상태 (정보성 — 실패해도 nginx 배포는 성공으로 처리.
            # FE/BE 가 내려가 있는 것은 이 레포의 배포 실패 사유가 아니다.)
            echo "--- 업스트림 상태 (정보성) ---"
            curl -s -o /dev/null -w 'FE  /api/health       -> %{http_code}\n' --max-time 5 http://localhost/api/health || true
            curl -s -o /dev/null -w 'BE  /actuator/health  -> %{http_code}\n' --max-time 5 http://localhost/actuator/health || true
